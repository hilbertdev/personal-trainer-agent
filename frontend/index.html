<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Phase 1 beta dashboard for workout planning and progress tracking."
    />
    <title>Personal Trainer Agent</title>
    <script>
      const theme = localStorage.getItem("workout-planner-theme") ?? "dark";
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (theme === "dark" || (theme === "system" && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
