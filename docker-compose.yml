name: workout-planner

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TrainingSqlite: Data Source=/data/training.db
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - training-sqlite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.console
    environment:
      TRAINING_SQLITE_CONNECTION_STRING: Data Source=/data/training.db
    volumes:
      - training-sqlite-data:/data

volumes:
  training-sqlite-data:
