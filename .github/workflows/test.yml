name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet test tests/Training.Domain.Tests/Training.Domain.Tests.csproj --no-restore
      - run: dotnet test tests/Training.Application.Tests/Training.Application.Tests.csproj --no-restore
      - run: dotnet test tests/Training.Strava.Tests/Training.Strava.Tests.csproj --no-restore

  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet test tests/Training.Infrastructure.Tests/Training.Infrastructure.Tests.csproj --filter "Category=Integration" --no-restore
      - run: dotnet test tests/Training.Api.IntegrationTests/Training.Api.IntegrationTests.csproj --filter "Category=Integration" --no-restore

  backend-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet test tests/Training.Infrastructure.Tests/Training.Infrastructure.Tests.csproj --filter "Category=Postgres" --no-restore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
