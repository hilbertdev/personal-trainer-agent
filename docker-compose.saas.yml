name: personal-trainer-saas

services:
  db:
    image: postgres:16-alpine
    container_name: personal-trainer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal-trainer
      POSTGRES_USER: personal-trainer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal-trainer -d personal-trainer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personal-trainer-net

  redis:
    image: redis:7-alpine
    container_name: personal-trainer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - personal-trainer-net

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: personal-trainer-smtp4dev
    restart: unless-stopped
    ports:
      - "5050:80"
      - "2525:25"
    networks:
      - personal-trainer-net

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: personal-trainer-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=personal-trainer;Username=personal-trainer;Password=${DB_PASSWORD:-ChangeMe123!}"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5075
      Jwt__Key: ${JWT_KEY:-super-secret-jwt-key-min-32-chars!!}
      Jwt__Issuer: personal-trainer-api
      Jwt__Audience: personal-trainer-app
      Resend__ApiKey: ${RESEND_API_KEY:-re_placeholder}
      Resend__From: "Personal Trainer <noreply@yourdomain.com>"
      Smtp__Host: smtp4dev
      Smtp__Port: "25"
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081}
      Cors__AllowLocalDevOrigins: "true"
    ports:
      - "5075:5075"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - personal-trainer-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5075/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  personal-trainer-net:
    driver: bridge
